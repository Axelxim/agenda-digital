name: Integracion continua

on:
  push:
    branches:
      - master
      - main
      - backend-api
  pull_request:
    branches:
      - master
      - main

jobs:
  frontend:
    name: Validar aplicacion Angular
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar codigo
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm test -- --watch=false

      - name: Compilar aplicacion
        run: npm run build

  backend:
    name: Validar API CodeIgniter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, mysqli
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist

      - name: Ejecutar pruebas
        run: composer test
